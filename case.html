<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#1f5f4e" />
    <title>Кейс | За Комфортом</title>
    <meta
      name="description"
      content="Подробный кейс ремонта и дизайна от студии «За Комфортом». Страница переехала в раздел /cases/."
    />
    <link rel="canonical" href="https://katalog.zakomfortom.com/" />
    <link rel="icon" type="image/png" href="assets/brand/logo.png" />
    <link rel="stylesheet" href="css/styles.css?v=77a1bd7d45" />
    <script>
      // Старый формат ссылок case.html?id=<slug> редиректит на статические страницы /cases/<slug>/.
      (function () {
        var id = new URLSearchParams(window.location.search).get("id") || "";
        if (/^[a-z0-9-]+$/.test(id)) {
          window.location.replace("cases/" + id + "/" + window.location.hash);
        } else {
          window.location.replace("index.html");
        }
      })();
    </script>
  </head>
  <body>
    <main>
      <div class="container section">
        <h1>Страница кейса переехала</h1>
        <p class="lead">Сейчас вы будете перенаправлены на новую страницу кейса.</p>
        <p><a class="btn btn--primary" href="index.html">Открыть каталог работ</a></p>
      </div>
    </main>
  </body>
</html>
